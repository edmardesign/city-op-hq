name: Validate BoraZe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
